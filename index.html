<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 가족 영단어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column (max 560px). Notebook-blue ink, highlighter-yellow marks the phonics pattern inside each word. */
:root{
  --bg:#EEF3FC; --card:#FFFFFF; --ink:#0E2350; --sub:#51618A; --line:#D3DDF2;
  --blue:#2350D8; --blue-ink:#FFFFFF; --sky:#DCE6FB; --deep:#0E2A6E; --cover:#0E2A6E;
  --mark:#FFE36E; --mark-ink:#0E2350;
  --ok:#1D7A4E; --ok-bg:#DDF3E7; --no:#C23A3A; --no-bg:#FBE3E3;
  --kr-display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --kr:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --en:"Lexend","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1430; --card:#14204A; --ink:#E7EDFF; --sub:#A3B1D6; --line:#24346A;
  --blue:#5B86FF; --blue-ink:#071233; --sky:#1C2D63; --deep:#9FB8FF; --cover:#1B2E6E;
  --mark:#F5D451; --mark-ink:#0B1430;
  --ok:#6FD3A0; --ok-bg:#163B2B; --no:#FF8E8E; --no-bg:#43202A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1430; --card:#14204A; --ink:#E7EDFF; --sub:#A3B1D6; --line:#24346A;
  --blue:#5B86FF; --blue-ink:#071233; --sky:#1C2D63; --deep:#9FB8FF; --cover:#1B2E6E;
  --mark:#F5D451; --mark-ink:#0B1430;
  --ok:#6FD3A0; --ok-bg:#163B2B; --no:#FF8E8E; --no-bg:#43202A; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--kr);font-size:16px;line-height:1.55;margin:0;padding-inline:16px;padding-block:16px 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top .title{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:18px;flex:none}
.chip{background:var(--sky);color:var(--deep);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;white-space:nowrap}
h1,h2{margin:0;text-wrap:balance}
p{margin:0}
.sub{color:var(--sub);font-size:14.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:14px;padding:12px 18px;font-weight:700;font-size:17px;background:var(--blue);color:var(--blue-ink);width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.kakao{background:#FEE500;color:#191919}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cover{background:var(--cover);color:#FFFFFF;border-radius:24px;padding:36px 24px 28px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.cover .lines{position:absolute;inset:0;background-image:repeating-linear-gradient(to bottom,transparent 0 33px,rgba(255,255,255,.08) 33px 34px);pointer-events:none}
.cover .margin{position:absolute;top:0;bottom:0;left:22px;width:2px;background:rgba(255,120,120,.45)}
.cover .eyebrow{font-family:var(--en);letter-spacing:.14em;font-size:12px;opacity:.8;padding-left:14px}
.cover h1{font-family:var(--kr-display);font-weight:400;font-size:clamp(44px,13vw,68px);line-height:1.08;padding-left:14px}
.cover h1 .hl{background:linear-gradient(transparent 58%,rgba(255,227,110,.85) 58% 92%,transparent 92%)}
.cover .tag{font-family:var(--en);font-size:15px;opacity:.85;padding-left:14px}
.cover .words{display:flex;flex-wrap:wrap;gap:8px;padding-left:14px}
.cover .words span{font-family:var(--en);font-size:13px;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 10px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-height:110px;width:100%}
.pick .big{font-size:24px;font-weight:700}
.pick .en{font-family:var(--en);font-size:13px;color:var(--sub);letter-spacing:.06em}
.pick.soon{opacity:.6;cursor:default}
.pick .bar{width:100%;height:6px;border-radius:99px;background:var(--sky);overflow:hidden;margin-top:auto}
.pick .bar i{display:block;height:100%;background:var(--blue)}
.addrow{display:flex;gap:8px}
.addrow input,.typein{flex:1;min-width:0;height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit}
.typein{font-family:var(--en);font-size:24px;text-align:center;letter-spacing:.04em;width:100%}
.addrow .btn{width:auto;min-height:50px}
.units{display:flex;flex-direction:column;gap:8px}
.unit{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.unit .no{font-family:var(--en);font-weight:600;color:var(--sub);font-size:14px;text-align:center}
.unit .pat{font-family:var(--en);font-weight:700;font-size:19px}
.unit .ex{font-size:13.5px;color:var(--sub)}
.unit .st{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px}
.st.done{background:var(--ok-bg);color:var(--ok)}
.st.todo{background:var(--sky);color:var(--deep)}
.wordcard{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:30px 20px}
.word{font-family:var(--en);font-weight:600;font-size:clamp(44px,14vw,64px);line-height:1.15;word-break:break-word}
.word mark{background:var(--mark);color:var(--mark-ink);border-radius:6px;padding:0 3px}
.mean{font-size:20px;font-weight:600}
.krq{font-size:clamp(32px,10vw,44px);font-weight:700}
.rule{font-size:14.5px;color:var(--sub)}
.speak{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.speak button{min-height:50px;border-radius:999px;padding:0 20px;background:var(--sky);color:var(--deep);font-weight:700;display:flex;align-items:center;gap:8px}
.speak button.slow{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.progress{display:flex;align-items:center;gap:10px;font-family:var(--en);font-size:14px;color:var(--sub)}
.progress .track{flex:1;height:8px;border-radius:99px;background:var(--sky);overflow:hidden}
.progress .track i{display:block;height:100%;background:var(--blue);transition:width .25s}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qhead{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:26px 18px}
.qtype{font-size:13px;font-weight:700;color:var(--deep);background:var(--sky);border-radius:999px;padding:3px 12px}
.slots{font-family:var(--en);font-size:22px;letter-spacing:.35em;color:var(--sub)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:64px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);padding:10px 12px;font-weight:600;font-size:17px;text-align:center;word-break:keep-all}
.opt.en{font-family:var(--en);font-size:21px}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:52px;height:56px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-family:var(--en);font-weight:600;font-size:24px}
.tile.used{opacity:.25}
.built{min-height:60px;display:flex;justify-content:center;align-items:center;gap:6px;font-family:var(--en);font-size:30px;font-weight:600;border-bottom:2px solid var(--line);padding-bottom:6px}
.feedback{min-height:24px;text-align:center;font-weight:700}
.feedback.ok{color:var(--ok)}.feedback.no{color:var(--no)}
.diff{font-family:var(--en);font-size:28px;font-weight:600;text-align:center}
.diff .x{color:var(--no);text-decoration:underline}
.err{color:var(--no);font-size:14px;text-align:center;min-height:20px}
.result{background:var(--card);border:2px solid var(--blue);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px}
.result .who{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.result .who b{font-family:var(--kr-display);font-weight:400;font-size:30px}
.result .when{font-family:var(--en);font-size:14px;color:var(--sub)}
.score{display:flex;align-items:baseline;gap:8px}
.score .n{font-family:var(--en);font-weight:700;font-size:64px;line-height:1;color:var(--blue)}
.score .of{font-family:var(--en);font-size:24px;color:var(--sub)}
.score .lab{margin-left:auto;font-weight:700;font-size:18px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts div{background:var(--sky);border-radius:12px;padding:10px;text-align:center}
.facts b{display:block;font-family:var(--en);font-size:19px;color:var(--deep)}
.facts span{font-size:12.5px;color:var(--sub)}
.wrongs{display:flex;flex-direction:column;gap:6px}
.wrongs .w{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.wrongs .w b{font-family:var(--en);font-weight:600}
.wrongs .w span{color:var(--sub);text-align:right}
.toast{text-align:center;font-weight:600;color:var(--ok);min-height:22px}
.sheet{display:flex;flex-direction:column;gap:14px}
.sheet label{font-weight:600;font-size:15px}
.sheet select{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;font:inherit}
.row{display:flex;align-items:center;gap:12px}
.row input[type=range]{flex:1}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch input{width:24px;height:24px}
.warn{background:var(--no-bg);color:var(--no);border-radius:12px;padding:12px 14px;font-size:14.5px}
.note{background:var(--sky);color:var(--deep);border-radius:12px;padding:12px 14px;font-size:14.5px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.btn:active{transform:none}}
</style>

</head>

/* ---------- storage ---------- */
const KEY="jjwords.v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}

if(S.hint===undefined)S.hint=true;
if(!S.mode)S.mode="sound";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function U(){const n=S.cur;if(!S.users[n])S.users[n]={days:[],ph:{},words:{},elemPos:0,last:null};const u=S.users[n];if(!u.midWords)u.midWords={};if(u.midPos==null)u.midPos=0;return u}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return ymd(new Date())}
function markDay(){const u=U(),t=today();if(!u.days.includes(t))u.days.push(t);save()}
function streak(){const u=U();const set=new Set(u.days);let n=0;const d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);
 while(set.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}

/* ---------- speech (English voices only) ---------- */
let VOICES=[];
const PREF=[/Natural/i,/Google US English/i,/Samantha/i,/Google UK English Female/i,/Google UK/i,/Aria|Jenny|Guy|Ava|Allison|Karen|Daniel|Moira|Tessa/i,/Zira|David|Mark/i];
function vscore(v){for(let i=0;i<PREF.length;i++)if(PREF[i].test(v.name))return i;return 50}
function loadVoices(){if(!("speechSynthesis"in window))return;VOICES=speechSynthesis.getVoices().filter(v=>v.lang&&/^en[-_]/i.test(v.lang)).sort((a,b)=>vscore(a)-vscore(b))}
if("speechSynthesis"in window){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(view.name==="settings"||view.name==="cover")render()}}
function pickVoice(){return VOICES.find(v=>v.name===S.voice)||VOICES[0]||null}
function robotic(){const v=pickVoice();return !v||/Zira|David|Mark|Heami/i.test(v.name)}
/* Android Chrome and iOS drop an utterance spoken in the same tick as cancel(), so only cancel when busy and speak a moment later */
function say(text,rate){if(!("speechSynthesis"in window))return;try{const ss=speechSynthesis;
 const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate||S.rate;u.volume=1;const v=pickVoice();if(v)u.voice=v;
 if(ss.paused)ss.resume();
 if(ss.speaking||ss.pending){ss.cancel();setTimeout(()=>ss.speak(u),120)}else ss.speak(u)}catch(e){}}

const IN_APP=IN_KAKAO||/NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent);
function openExternal(){const url=location.href;
 if(IN_KAKAO){location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(url);return}
 if(/Android/i.test(navigator.userAgent)){location.href="intent://"+url.replace(/^https?:\/\//,"")+"#Intent;scheme=https;package=com.android.chrome;end";return}}
if(IN_KAKAO&&location.protocol==="https:"&&!sessionStorageGet("triedExt")){sessionStorageSet("triedExt","1");openExternal()}
function sessionStorageGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function highlight(word,re){if(!re)return esc(word);const r=new RegExp(re,"gi");let out="",last=0,m;
 while((m=r.exec(word))!==null){if(m[0]==="")break;out+=esc(word.slice(last,m.index))+"<mark>"+esc(m[0])+"</mark>";last=m.index+m[0].length}
 return out+esc(word.slice(last))}
function stamp(){const d=new Date();return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function norm(s){return String(s).toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ").trim()}
function tokens(m){return m.replace(/\([^)]*\)/g,"").split(/[;,]/).map(x=>x.trim()).filter(Boolean)}
/* words whose Korean meaning shares a token with the target: accepted as correct in typing questions */
function synonyms(w){const t=new Set(tokens(w[1]));return ELEM.concat(MID).filter(e=>norm(e[0])!==norm(w[0])&&tokens(e[1]).some(x=>t.has(x))).map(e=>norm(e[0]))}
function slots(word,showFirst){return word.split("").map((c,i)=>c===" "?"&nbsp;":(i===0&&showFirst?esc(c):"_")).join(" ")}
function diffHtml(target,typed){let o="";for(let i=0;i<target.length;i++){const c=target[i];o+=(typed[i]||"").toLowerCase()===c.toLowerCase()?esc(c):`<span class="x">${esc(c)}</span>`}return o}

function vLevels(){
 const u=U();
 const phDone=Object.values(u.ph).filter(x=>x.best>=16).length;
 const elemKnown=Object.keys(u.words).filter(w=>u.words[w].ok>0).length;
 const midKnown=Object.keys(u.midWords).filter(w=>u.midWords[w].ok>0).length;
 const prog={phonics:[phDone,PHONICS.length],elem:[elemKnown,ELEM.length],mid:[midKnown,MID.length]};
 const cards=LEVELS.map(L=>{const p=prog[L.id];const pct=p?Math.round(p[0]/p[1]*100):0;
  return `<button class="pick ${L.soon?"soon":""}" data-act="${L.soon?"":"level"}" data-id="${L.id}" ${L.soon?'aria-disabled="true"':""}>
  <span class="en">${L.en}</span><span class="big">${L.ko}</span><span class="sub">${L.desc}</span>
  ${p?`<span class="sub" style="font-family:var(--en)">${p[0]} / ${p[1]}</span><span class="bar"><i style="width:${pct}%"></i></span>`:""}</button>`}).join("");
 return topbar("단계 고르기","modepick",true)+`<div class="chip" style="align-self:flex-start">${S.mode==="silent"?"조용히 학습":"소리 학습"}</div><div class="grid">${cards}</div>
 <p class="sub">처음이면 <b>파닉스</b>부터 시작해요. 단어를 소리 내어 읽을 수 있으면 <b>초등</b>으로 가요. 연속 ${streak()}일째 공부 중.</p>`}

function vUnits(){

  <span><span class="pat">${esc(x.p)}</span> <span class="ex">· ${esc(x.w.slice(0,3).map(w=>w[0]).join(", "))}</span><br><span class="ex">${esc(x.hint)}</span></span>

const QLABEL={spell:"소리 듣고 철자 고르기",listen:"소리 듣고 뜻 고르기",read:"단어 보고 뜻 고르기",tiles:"소리 듣고 글자 카드 맞추기",dict:"소리 듣고 영어로 쓰기",kr2en:"한국어 보고 영어로 쓰기"};

 let big;

 else big=S.mode==="silent"?`<div class="krq">${esc(q.w[1])}</div>`:`<div style="font-size:54px">🎧</div>${q.kind==="dict"?`<div class="rule">뜻: ${esc(q.w[1])}</div>`:""}`;
 const showSpeak=q.kind!=="kr2en"||answered!=null;
 let body="";
 if(!typing){
  body=`<div class="opts">${q.opts.map((o,k)=>{let cls="opt"+(q.kind==="spell"?" en":"");if(answered!=null){if(o===q.ans)cls+=" right";else if(k===answered)cls+=" wrong"}
   return `<button class="${cls}" data-act="pick" data-k="${k}" ${answered!=null?"disabled":""}>${esc(o)}</button>`}).join("")}</div>`;
 }else if(q.kind==="tiles"){

  body=answered==null?`<div class="built" aria-label="만든 단어">${esc(built)||"&nbsp;"}</div>
   <div class="tiles">${q.letters.map((c,k)=>`<button class="tile ${view.tiles.includes(k)?"used":""}" data-act="tile" data-k="${k}" ${view.tiles.includes(k)?"disabled":""}>${esc(c)}</button>`).join("")}</div>
   <div class="navrow"><button class="btn ghost" data-act="tileback">⌫ 지우기</button><button class="btn" data-act="tilecheck" ${built.length<q.w[0].length?"disabled":""}>확인</button></div>`:"";
 }else{
  body=answered==null?`<div class="slots">${slots(q.w[0],S.hint)}</div>
   <input class="typein" id="typein" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="영어로 쓰기" placeholder="여기에 쓰기">
   <p class="err" id="typeerr"></p><button class="btn" data-act="typecheck">확인</button>`:"";
 }
 let fb="";
 if(answered!=null){
  const ok=view.lastOk;
  if(typing){fb=ok?`<div class="feedback ok">정답이에요!${view.synNote?` (${esc(view.synNote)})`:""}</div><div class="diff">${esc(q.w[0])}</div>`:
   `<div class="feedback no">내 답: ${esc(view.typed||"")}</div><div class="diff">${diffHtml(q.w[0],view.typed||"")}</div><div class="rule" style="text-align:center">${esc(q.w[1])}</div>`}
  else fb=`<div class="feedback ${ok?"ok":"no"}">${ok?"정답이에요!":"정답: "+esc(q.kind==="spell"?q.w[0]+" ("+q.w[1]+")":q.ans)}</div>`;
 }
 return topbar(view.title,view.back,true)+
 `<div class="progress"><span>${i+1}/${qs.length}</span><span class="track"><i style="width:${Math.round(i/qs.length*100)}%"></i></span><span>${delayedGrade()?"마지막에 채점":"맞음 "+score}</span></div>
 ${delayedGrade()?`<div class="note">정답과 점수는 시험을 모두 마친 뒤에 보여 줘요.</div>`:""}
 <div class="card qhead"><span class="qtype">${QLABEL[q.kind]}</span>${big}
 ${S.mode==="sound"&&showSpeak?`<div class="speak"><button data-act="qsay">🔊 ${answered!=null&&q.kind==="kr2en"?"발음 듣기":"다시 듣기"}</button><button class="slow" data-act="qsayslow">🐢 천천히</button></div>`:""}</div>
 ${body}${fb}
 ${answered!=null&&!view.lastOk?`<button class="btn" data-act="qnext">${i<qs.length-1?"다음 문제":"결과 보기"}</button>`:""}`}

/* ---------- flows ---------- */
function startPhonics(i){const x=PHONICS[i];view={name:"learn",items:x.w.map(w=>[w[0],w[1],""]),i:0,unit:i,back:"units",t0:Date.now()};render();if(S.mode==="sound")say(x.w[0][0])}
function startElem(){
 const u=U();const W=u.words;
 const seen=ELEM.filter(e=>W[e[0]]);
 const review=seen.map(e=>[e,(W[e[0]].bad||0)*3-(W[e[0]].ok||0)+Math.random()]).sort((a,b)=>b[1]-a[1]).slice(0,DAY_REVIEW).map(x=>x[0]);
 const fresh=[];let p=u.elemPos||0;while(fresh.length<DAY_NEW+DAY_REVIEW-review.length&&p<ELEM.length){if(!W[ELEM[p][0]])fresh.push(ELEM[p]);p++}
 let items=review.concat(fresh);
 if(items.length<DAY_NEW+DAY_REVIEW){items=items.concat(shuffle(seen.filter(e=>!items.includes(e))).slice(0,DAY_NEW+DAY_REVIEW-items.length))}
 view={name:"learn",level:"elem",items:items.map(e=>[e[0],e[1],e[2]]),i:0,unit:null,back:"levels",t0:Date.now(),nextPos:p};render();if(S.mode==="sound")say(view.items[0][0])}
function startMiddle(){
 const u=U(),W=u.midWords,seen=MID.filter(e=>W[e[0]]);
 const review=seen.map(e=>[e,(W[e[0]].bad||0)*3-(W[e[0]].ok||0)+Math.random()]).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
 const fresh=[];let p=u.midPos||0;while(fresh.length<40-review.length&&p<MID.length){if(!W[MID[p][0]])fresh.push(MID[p]);p++}
 let items=review.concat(fresh);if(items.length<40)items=items.concat(shuffle(seen.filter(e=>!items.includes(e))).slice(0,40-items.length));
 view={name:"learn",level:"mid",items:items.map(e=>[e[0],e[1],e[2]]),i:0,unit:null,back:"levels",t0:Date.now(),nextPos:p};render();if(S.mode==="sound")say(view.items[0][0])}
function meaningOpts(w){const all=ELEM.concat(MID);const same=all.filter(e=>e[2]===w[2]&&e[1]!==w[1]);const pool=shuffle(same.length>=3?same:all.filter(e=>e[1]!==w[1]));
 const others=[];for(const e of pool){if(!others.includes(e[1]))others.push(e[1]);if(others.length===3)break}return shuffle([w[1],...others])}
function tileQ(w){const letters=shuffle(w[0].replace(/ /g,"").split(""));return{kind:"tiles",w,ans:w[0].replace(/ /g,""),letters}}
function makeQuiz(){
 const items=view.items;const unit=view.unit;const level=view.level||(unit!=null?"phonics":"elem");const retryOnly=!!view.retryOnly;let qs=[];
 if(unit!=null){
  const pool=PHONICS[unit].w;
  if(S.mode==="silent"){
   const read=shuffle(pool).map(w=>({kind:"read",w,ans:w[1],opts:meaningOpts([w[0],w[1],""])}));
   const write=shuffle(pool).map(w=>({kind:"kr2en",w,ans:w[0]}));
   qs=read.concat(write);
  }else{
   const spell=shuffle(pool).map(w=>{const others=shuffle(pool.filter(x=>x[0]!==w[0])).slice(0,3).map(x=>x[0]);return{kind:"spell",w,ans:w[0],opts:shuffle([w[0],...others])}});
   const tiles=shuffle(pool).map(tileQ);
   qs=spell.concat(tiles);
  }
 }else if(retryOnly){
  qs=shuffle(items).map((w,i)=>i%2===0?{kind:S.mode==="silent"?"read":"listen",w,ans:w[1],opts:meaningOpts(w)}:{kind:"kr2en",w,ans:w[0]});
 }else{
  let pickPool=shuffle(items);while(pickPool.length<TEST_N)pickPool=pickPool.concat(shuffle(items));
  let k=0;
  (S.mode==="silent"?SILENT_MIX:ELEM_MIX).forEach(([kind,n])=>{for(let j=0;j<n;j++){const w=pickPool[k++];
   if(kind==="listen"||kind==="read")qs.push({kind,w,ans:w[1],opts:meaningOpts(w)});else qs.push({kind,w,ans:w[0]})}});
 }
 view={name:"quiz",level,qs,i:0,answered:null,locked:false,score:0,typeScore:0,typeTotal:qs.filter(q=>q.kind==="dict"||q.kind==="kr2en"||q.kind==="tiles").length,wrong:[],unit,items,t0:view.t0,nextPos:view.nextPos,tiles:[],back:unit!=null?"units":"levels",title:unit!=null?`파닉스 ${unit+1} 시험`:"오늘의 시험"};
 render();autoQ()}
function autoQ(){const q=view.qs[view.i];if(S.mode==="sound"&&q.kind!=="read"&&q.kind!=="kr2en")sayQ();const t=$("#typein");if(t)t.focus()}
function sayQ(rate){const q=view.qs[view.i];say(q.w[0],rate)}
function delayedGrade(){return view.level==="mid"||view.level==="high"}
function wordRecords(){const u=U();return view.level==="mid"?u.midWords:u.words}
function nextQuestion(){
 if(view.i<view.qs.length-1){view.i++;view.answered=null;view.locked=false;view.tiles=[];view.typed="";view.synNote="";render();autoQ()}
 else finishQuiz()}
function afterGrade(ok){
 if(delayedGrade()){view.locked=true;setTimeout(nextQuestion,140);return}
 render();if(ok){view.locked=true;setTimeout(nextQuestion,650)}}
function grade(ok,typed,synNote){
 if(view.locked)return;const q=view.qs[view.i];view.answered=delayedGrade()?null:0;view.lastOk=ok;view.typed=typed;view.synNote=synNote||"";
 const isType=q.kind==="dict"||q.kind==="kr2en"||q.kind==="tiles";
 if(ok){view.score++;if(isType)view.typeScore++}else view.wrong.push([q.w[0],q.w[1]]);
 if(view.unit==null){const records=wordRecords();const rec=records[q.w[0]]||(records[q.w[0]]={ok:0,bad:0});if(ok)rec.ok++;else rec.bad++;save()}
 if(!delayedGrade()&&S.mode==="sound"&&(!ok||q.kind==="kr2en"))say(q.w[0]);afterGrade(ok)}
function finishQuiz(){
 const u=U();const v=view;const mins=Math.max(1,Math.round((Date.now()-v.t0)/60000));
 const seenW=new Set();const wrong=v.wrong.filter(w=>{if(seenW.has(w[0]))return false;seenW.add(w[0]);return true});
 let r;
 if(v.unit!=null){const prev=u.ph[v.unit];u.ph[v.unit]={best:Math.max(prev?prev.best:0,v.score),last:v.score,date:today()};
  const done=Object.values(u.ph).filter(x=>x.best>=16).length;
  r={what:`파닉스 ${v.unit+1}단원 · ${PHONICS[v.unit].p} (${PHONICS[v.unit].hint})`,prog:done+"/"+PHONICS.length,progLabel:"통과한 단원"};
 }else{
  const records=v.level==="mid"?u.midWords:u.words;const bank=v.level==="mid"?MID:ELEM;
  v.items.forEach(w=>{if(!records[w[0]])records[w[0]]={ok:0,bad:0}});
  if(v.nextPos!=null){if(v.level==="mid")u.midPos=v.nextPos;else u.elemPos=v.nextPos}
  const known=Object.keys(records).filter(w=>records[w].ok>0).length;
  const levelName={elem:"초등",mid:"중등",high:"고등"}[v.level]||"단어";
  r={what:`${levelName} 단어 · 오늘 ${v.items.length}개 학습`,prog:known+"/"+bank.length,progLabel:"맞힌 단어"};
 }
 Object.assign(r,{level:v.level||"phonics",score:v.score,total:v.qs.length,typeScore:v.typeScore,typeTotal:v.typeTotal,wrong,minutes:mins,when:stamp(),mode:S.mode==="silent"?"조용히 학습":"소리 학습"});
 u.last=r;markDay();save();go("result",{r})}
async function share(){
 const text=shareText(view.r);const toast=$("#toast");
 try{if(navigator.share){await navigator.share({text});toast.textContent="보냈어요!";return}}catch(e){if(e&&e.name==="AbortError")return}
 try{await navigator.clipboard.writeText(text);toast.textContent="결과를 복사했어요. 카톡 가족방에 붙여넣기 해 주세요."}
 catch(e){toast.textContent="공유가 안 되면 결과 문구를 길게 눌러 복사해 주세요."}}

/* ---------- render & events ---------- */
function render(){
 const m={cover:vCover,profiles:vProfiles,mode:vMode,levels:vLevels,units:vUnits,learn:vLearn,quiz:vQuiz,result:vResult,settings:vSettings};
 const keep=S.cur;$("#app").innerHTML=(m[view.name]||vCover)();S.cur=keep;
 if(view.name==="settings"){const r=$("#rate");if(r)r.oninput=()=>{S.rate=+r.value;$("#rateo").textContent=S.rate.toFixed(1);save()};
  const s=$("#voice");if(s)s.onchange=()=>{S.voice=s.value;save();say("Hello")};
  const h=$("#hint");if(h)h.onchange=()=>{S.hint=h.checked;save()}}
 if(view.name==="profiles"){const i=$("#newname");if(i)i.onkeydown=e=>{if(e.key==="Enter")act("addp")}}
 const t=$("#typein");if(t){t.onkeydown=e=>{if(e.key==="Enter")act("typecheck")};t.oninput=()=>{const er=$("#typeerr");if(er)er.textContent=""}}
}
let prevView=null;
function act(a,el){
 switch(a){
  case"cover":go("cover");break;
  case"profiles":go("profiles");break;
  case"setp":S.cur=el.dataset.n;save();go("mode");break;
  case"addp":{const i=$("#newname");const n=(i.value||"").trim();const err=$("#adderr");
   if(!n){err.textContent="이름을 입력해 주세요.";i.focus();return}
   if(S.profiles.includes(n)){err.textContent="이미 있는 이름이에요. 위에서 골라 주세요.";return}
   S.profiles.push(n);S.cur=n;save();go("mode");break}
  case"modepick":go("mode");break;
  case"mode":S.mode=el.dataset.mode;save();go("levels");break;
  case"levels":go("levels");break;
  case"level":if(el.dataset.id==="phonics")go("units");else if(el.dataset.id==="elem")startElem();else if(el.dataset.id==="mid")startMiddle();break;
  case"units":go("units");break;
  case"unit":startPhonics(+el.dataset.i);break;
  case"say":say(view.items[view.i][0]);break;
  case"sayslow":say(view.items[view.i][0],0.55);break;
  case"next":view.i++;render();if(S.mode==="sound")say(view.items[view.i][0]);break;
  case"prev":if(view.i>0){view.i--;render();if(S.mode==="sound")say(view.items[view.i][0])}break;
  case"startquiz":makeQuiz();break;
  case"qsay":sayQ();break;
  case"qsayslow":sayQ(0.55);break;
  case"pick":{if(view.answered!=null||view.locked)return;const q=view.qs[view.i];const k=+el.dataset.k;const ok=q.opts[k]===q.ans;view.answered=delayedGrade()?null:k;view.lastOk=ok;
   if(ok)view.score++;else view.wrong.push([q.w[0],q.w[1]]);
   if(view.unit==null){const records=wordRecords();const rec=records[q.w[0]]||(records[q.w[0]]={ok:0,bad:0});if(ok)rec.ok++;else rec.bad++;save()}
   if(!delayedGrade()&&S.mode==="sound"&&!ok)say(q.w[0]);afterGrade(ok);break}
  case"tile":{const k=+el.dataset.k;if(!view.tiles.includes(k)){view.tiles.push(k);render()}break}
  case"tileback":view.tiles.pop();render();break;
  case"tilecheck":{const q=view.qs[view.i];const built=view.tiles.map(k=>q.letters[k]).join("");grade(norm(built)===norm(q.ans),built);break}
  case"typecheck":{const q=view.qs[view.i];const t=$("#typein");const typed=(t.value||"").trim();
   if(!typed){$("#typeerr").textContent="먼저 영어로 써 주세요.";t.focus();return}
   const n=norm(typed);if(n===norm(q.w[0])){grade(true,typed);return}
   if(synonyms(q.w).includes(n)){grade(true,typed,`${q.w[0]}도 같은 뜻이에요`);return}
   grade(false,typed);break}
  case"qnext":nextQuestion();break;
  case"share":share();break;
  case"retrywrong":{const bank=view.r.level==="mid"?MID:ELEM;const w=view.r.wrong.map(x=>{const e=bank.find(y=>y[0]===x[0]);return[x[0],x[1],e?e[2]:""]});view={name:"learn",level:view.r.level||"elem",retryOnly:true,items:w,i:0,unit:null,back:"levels",t0:Date.now(),nextPos:null};render();if(S.mode==="sound")say(w[0][0]);break}
  case"settings":prevView=view;go("settings",{back:"closeset"});break;
  case"closeset":if(prevView){view=prevView;prevView=null;render()}else go("cover");break;
  case"test":say(el.dataset.w);break;
  case"external":openExternal();break;
 }
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled||!b.dataset.act)return;act(b.dataset.act,b)});
render();
</script>
